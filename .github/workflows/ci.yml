name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
        env:
          # CRA needs these defined to build; dummy values are fine for CI.
          REACT_APP_SUPABASE_URL: https://ci-placeholder.supabase.co
          REACT_APP_SUPABASE_ANON_KEY: ci-placeholder
